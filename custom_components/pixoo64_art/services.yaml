send_notification:
  name: Send Notification
  description: Send a custom text or animated notification to the Pixoo64 display.
  fields:
    title:
      name: Title
      description: Optional bold header title displayed at the top of the screen.
      required: false
      example: "Front Door"
      selector:
        text:
    message:
      name: Message
      description: The text message to display on the screen.
      required: true
      example: "Someone is at the door!"
      selector:
        text:
    icon:
      name: Custom Icon ID / URL / AWTRIX
      description: "Custom pixel icon: AWTRIX icon slug (e.g. 'house-climate', 'btccoin', 'kick', or 'awtrix:slug'), LaMetric ID (e.g. 'a2710' for animated GIF, '28340' for PNG), or direct image URL. Browse icons at https://awtrix.de/icons or https://developer.lametric.com/icons"
      required: false
      example: "house-climate"
      selector:
        text:
    type:
      name: Notification Type (Icon/Animation)
      description: Select the visual theme and animation for the notification.
      required: false
      default: text
      selector:
        select:
          options:
            - label: "Text Only"
              value: "text"
            - label: "Custom Pixel Icon (AWTRIX / LaMetric / URL)"
              value: "custom"
            - label: "Information (Blue)"
              value: "info"
            - label: "Success (Green)"
              value: "success"
            - label: "Warning (Orange)"
              value: "warning"
            - label: "Error (Red)"
              value: "error"
            - label: "Checkmark (V)"
              value: "v"
            - label: "Cancel (X)"
              value: "x"
            - label: "Alert (Bell)"
              value: "alert"
            - label: "Emergency Siren / Alarm"
              value: "alarm"
            - label: "Weather (Cloud & Sun)"
              value: "weather"
            - label: "Attack / Rocket"
              value: "attack"
            - label: "Smart Home: Boiler (Water Heater)"
              value: "boiler"
            - label: "Smart Home: AC / Climate / Snowflake"
              value: "ac"
            - label: "Smart Home: Fan"
              value: "fan"
            - label: "Smart Home: Light / Lamp"
              value: "light"
            - label: "Smart Home: Robot Vacuum"
              value: "vacuum"
            - label: "Smart Home: Shutter"
              value: "shutter"
            - label: "Smart Home: Car"
              value: "car"
            - label: "Smart Home: Door"
              value: "door"
            - label: "Smart Home: Garage / Gate"
              value: "garage"
            - label: "Smart Home: Lock"
              value: "lock"
            - label: "Smart Home: Washer"
              value: "washer"
            - label: "Smart Home: Dryer"
              value: "dryer"
            - label: "Smart Home: Trash"
              value: "trash"
            - label: "Smart Home: Mail"
              value: "mail"
            - label: "Smart Home: Power / Plug"
              value: "power"
            - label: "Smart Home: Home / Presence"
              value: "home"
            - label: "Smart Home: Motion / Person"
              value: "motion"
            - label: "Life: Coffee"
              value: "coffee"
            - label: "Life: Package / Delivery"
              value: "package"
            - label: "Life: Pet Paw"
              value: "pet"
            - label: "Life: Plant / Leaf"
              value: "plant"
            - label: "Smart Home: Fire / Smoke"
              value: "fire"
            - label: "Smart Home: Water / Leak"
              value: "water"
            - label: "Device: Battery"
              value: "battery"
            - label: "Device: WiFi"
              value: "wifi"
            - label: "Device: Phone"
              value: "phone"
            - label: "Device: Camera"
              value: "camera"
            - label: "Event: Calendar"
              value: "calendar"
            - label: "Event: Timer"
              value: "timer"
            - label: "Entertainment: Music"
              value: "music"
            - label: "Nature: Sun"
              value: "sun"
            - label: "Nature: Moon / Sleep"
              value: "moon"
    duration:
      name: Duration (Seconds)
      description: How long to display the notification before returning to the album art.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: seconds
    anim_speed:
      name: Animation Speed (ms per frame)
      description: "Optional frame delay in milliseconds for animated icons. Lower values play faster (default extracts native speed from GIF/WebP and doubles the animation speed, e.g. 50-150ms)."
      required: false
      example: 60
      selector:
        number:
          min: 20
          max: 1000
          step: 10
          unit_of_measurement: ms
    burned_text:
      name: Burned Text Mode
      description: "When true (recommended), renders text directly onto the pixel buffer with freeware typography and bold titles. When false, uses Pixoo hardware font 190 text overlay."
      required: false
      default: true
      selector:
        boolean:
    play_buzzer:
      name: Play Buzzer
      description: Sound the device buzzer when the notification appears.
      required: false
      default: false
      selector:
        boolean:
    buzzer_active:
      name: Buzzer Beep Time (ms)
      description: Duration of the beep tone in milliseconds.
      required: false
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: ms
    buzzer_off:
      name: Buzzer Silence Time (ms)
      description: Duration of silence between beeps in milliseconds.
      required: false
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: ms
    buzzer_total:
      name: Buzzer Total Time (ms)
      description: Total time the buzzer cycle will play in milliseconds.
      required: false
      default: 3000
      selector:
        number:
          min: 500
          max: 10000
          unit_of_measurement: ms
    color:
      name: Custom Color
      description: Optional HEX color override (e.g. '#FFCC00').
      required: false
      selector:
        text:

send_command:
  name: Send Pixoo Command
  description: Send a raw or structured command directly to the Pixoo64 device API.
  fields:
    command:
      name: Command / Action
      description: The API command path (e.g. 'Channel/SetBrightness', 'Channel/SetIndex', 'Device/SetHighLightMode').
      required: true
      example: "Channel/SetBrightness"
      selector:
        text:
    payload:
      name: Command Payload Parameters
      description: Optional JSON dictionary of additional parameters required by the Pixoo command.
      required: false
      example: '{"Brightness": 80}'
      selector:
        object:

create_chart:
  name: Create Hit Parade Chart
  description: Query local playback analytics and display an animated countdown carousel of Top Tracks, Top Artists, or Completed Albums on the Pixoo64.
  fields:
    chart_type:
      name: Chart Type
      description: Type of leaderboard to display.
      required: false
      default: "Top Tracks"
      selector:
        select:
          options:
            - "Top Tracks"
            - "Top Artists"
            - "Completed Albums"
    timeframe:
      name: Timeframe
      description: Time bucket for the chart.
      required: false
      default: "Weekly"
      selector:
        select:
          options:
            - "Daily"
            - "Weekly"
            - "Monthly"
            - "Yearly"
            - "All-Time"
    period:
      name: Period
      description: Specific calendar window (e.g. 'Current', 'Oct 18 - Oct 24, 2026', 'October 2026').
      required: false
      default: "Current"
      selector:
        text:
    direction:
      name: Countdown Direction
      description: Order in which chart ranks are displayed.
      required: false
      default: "Countdown (10 -> 1)"
      selector:
        select:
          options:
            - "Countdown (10 -> 1)"
            - "Ascending (1 -> 10)"
    limit:
      name: Chart Size Limit (Top N)
      description: Number of items in the countdown (3 - 20).
      required: false
      default: 10
      selector:
        number:
          min: 3
          max: 20
          mode: box
    slide_duration:
      name: Slide Duration (Seconds)
      description: How long each rank slide is shown on the Pixoo64 (2 - 10 seconds).
      required: false
      default: 4
      selector:
        number:
          min: 2
          max: 10
          unit_of_measurement: seconds

cancel_chart:
  name: Cancel Hit Parade Chart
  description: Immediately stop an active Hit Parade chart countdown and restore the current media or clock view.

get_leaderboard:
  name: Get Playback Leaderboard
  description: Retrieve the top played tracks, artists, or completed albums recorded by Pixoo64 playback analytics.
  fields:
    chart_type:
      name: Chart Type
      description: Leaderboard category ('Top Tracks', 'Top Artists', or 'Completed Albums').
      required: false
      default: "Top Tracks"
      selector:
        select:
          options:
            - "Top Tracks"
            - "Top Artists"
            - "Completed Albums"
    timeframe:
      name: Timeframe
      description: Time bucket ('Daily', 'Weekly', 'Monthly', 'Yearly', 'All-Time').
      required: false
      default: "Weekly"
      selector:
        select:
          options:
            - "Daily"
            - "Weekly"
            - "Monthly"
            - "Yearly"
            - "All-Time"
    period:
      name: Period
      description: Specific period label (e.g. 'Current') or rolling window ('week', 'month', 'all').
      required: false
      default: "Current"
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of top entries to return (1-50).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

clear_cache:
  name: Clear Persistent Cache
  description: Purge persistent SQLite and local disk caches (master album covers, artist slider frames, and/or playback analytics).
  fields:
    scope:
      name: Cache Scope
      description: Which portion of the persistent cache to clear.
      required: false
      default: all
      selector:
        select:
          options:
            - label: "All Caches & Analytics"
              value: "all"
            - label: "Master Album Covers Only"
              value: "masters"
            - label: "Artist Slider Frames Only"
              value: "artists"
            - label: "Playback Analytics Only"
              value: "analytics"
            - label: "Pixel Icons (AWTRIX & LaMetric) Only"
              value: "icons"

get_analytics:
  name: Get Playback Analytics Summary
  description: Retrieve lifetime and periodic database playback analytics (total tracks, artists, play counts today/week/month, disk size, leaders, etc.).

